<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolce Vida - Login</title>
    <!-- Dirección oficial y completa de Bootstrap -->
    <link href="css/bootstrap.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 390px;
        }
        .btn-custom {
            background-color: #ff6f91;
            color: white;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            background-color: #ff4a75;
            color: white;
            transform: translateY(-2px);
        }
        .store-title {
            color: #4a4a4a;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 class="store-title">🍬 Dolce Vida</h2>
        <p class="text-muted text-center mb-4">Sistema de Inventario Virtual</p>
        
        <form action="LoginController" method="POST">
            <div class="mb-3">
                <label class="form-label text-secondary fw-semibold">Usuario</label>
                <input type="text" class="form-control" name="usuario" placeholder="Ej: karen_vallejo" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary fw-semibold">Contraseña</label>
                <input type="password" class="form-control" name="contrasena" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-custom w-100 py-2 fw-bold">Ingresar al Sistema</button>
        </form>
    </div>

</body>
</html>
